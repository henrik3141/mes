<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiple Eisenstein Series</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
  /* ===== CSS RESET & BASE ===== */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #faf8f5;
    --bg-alt: #f2efe9;
    --text: #2c2418;
    --text-muted: #6b5e4f;
    --accent: #2b3a37;
    --accent-hover: #3a4f4b;
    --border: #d6cfc4;
    --border-light: #e8e2d8;
    --tag-bg: #ece7de;
    --tag-active: #2b3a37;
    --tag-active-text: #faf8f5;
    --shadow: rgba(44, 36, 24, 0.06);
    --font-serif: 'Latin Modern Roman', 'Computer Modern', 'CMU Serif', 'STIX Two Text', 'Libertinus Serif', Georgia, 'Times New Roman', serif;
    --font-mono: 'Latin Modern Mono', 'CMU Typewriter Text', 'Courier New', monospace;
    --max-width: 820px;
    --transition: 0.2s ease;
  }

  html { font-size: 17px; scroll-behavior: smooth; }

  body {
    font-family: var(--font-serif);
    background: var(--bg);
    color: var(--text);
    line-height: 1.72;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== LAYOUT ===== */
  .page-wrapper {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
  }

  /* ===== HEADER ===== */
  .site-header {
    text-align: center;
    margin-bottom: 1.2rem;
    padding-bottom: 0.5rem;
  }

  .site-header h1 {
    font-size: 2.1rem;
    font-weight: 400;
    letter-spacing: -0.01em;
    margin-bottom: 0.35rem;
    color: var(--text);
    font-variant: small-caps;
  }

  .site-header .subtitle {
    font-size: 0.92rem;
    color: var(--text-muted);
    margin-bottom: 0.15rem;
    letter-spacing: 0.04em;
    font-variant: small-caps;
  }

  /* ===== LANGUAGE TOGGLE ===== */
  .lang-toggle {
    position: absolute;
    top: 1.2rem;
    right: 1.5rem;
    display: flex;
    gap: 0.4rem;
  }

  .lang-btn {
    font-size: 1.3rem;
    background: none;
    border: none;
    cursor: pointer;
    opacity: 0.4;
    transition: opacity var(--transition);
    padding: 0.15rem;
    line-height: 1;
  }

  .lang-btn:hover { opacity: 0.7; }
  .lang-btn.active { opacity: 1; }

  .page-wrapper { position: relative; }

  /* ===== NAVIGATION TABS ===== */
  .nav-tabs {
    display: flex;
    justify-content: center;
    gap: 0;
    margin-bottom: 1.2rem;
    border-bottom: 1.5px solid var(--border);
  }

  .nav-tab {
    background: none;
    border: none;
    font-family: var(--font-serif);
    font-size: 0.98rem;
    padding: 0.7rem 1.8rem;
    color: var(--text-muted);
    cursor: pointer;
    position: relative;
    transition: color var(--transition);
    font-variant: small-caps;
    letter-spacing: 0.04em;
  }

  .nav-tab:hover { color: var(--text); }

  .nav-tab.active {
    color: var(--accent);
    font-weight: 600;
  }

  .nav-tab.active::after {
    content: '';
    position: absolute;
    bottom: -1.5px;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--accent);
  }

  /* ===== SEARCH BAR ===== */
  .search-bar {
    margin-bottom: 0.8rem;
  }

  .search-bar input {
    width: 100%;
    font-family: var(--font-serif);
    font-size: 0.9rem;
    padding: 0.5rem 0.8rem;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 3px;
    transition: border-color var(--transition);
  }

  .search-bar input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .search-bar input::placeholder {
    color: var(--border);
    font-style: italic;
  }

  mark.search-hl {
    background: #e8d44d40;
    color: inherit;
    padding: 0 1px;
    border-radius: 2px;
    border-bottom: 1.5px solid #c4a84d;
  }

  /* ===== FILTER BAR ===== */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1.6rem;
    padding: 1rem 1.2rem;
    background: var(--bg-alt);
    border: 1px solid var(--border-light);
    border-radius: 3px;
  }

  .filter-bar label {
    font-size: 0.82rem;
    color: var(--text-muted);
    font-variant: small-caps;
    letter-spacing: 0.06em;
    margin-right: 0.2rem;
  }

  .filter-bar select {
    font-family: var(--font-serif);
    font-size: 0.88rem;
    padding: 0.32rem 0.6rem;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 2px;
    cursor: pointer;
    appearance: auto;
  }

  .filter-sep {
    width: 1px;
    height: 1.4rem;
    background: var(--border);
    margin: 0 0.3rem;
  }

  .filter-bar .sort-btn {
    font-family: var(--font-serif);
    font-size: 0.85rem;
    padding: 0.3rem 0.7rem;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    border-radius: 2px;
    cursor: pointer;
    transition: all var(--transition);
  }

  .filter-bar .sort-btn:hover,
  .filter-bar .sort-btn.active {
    background: var(--accent);
    color: var(--tag-active-text);
    border-color: var(--accent);
  }

  .result-count {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-left: auto;
    font-style: italic;
  }

  /* ===== TAG SECTION (collapsible, currently hidden) ===== */
  .tag-section { display: none; }

  .tag-toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-family: var(--font-serif);
    font-size: 0.82rem;
    color: var(--text-muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.2rem 0;
    font-variant: small-caps;
    letter-spacing: 0.04em;
    transition: color var(--transition);
  }

  .tag-toggle:hover { color: var(--accent); }

  .tag-toggle .arrow {
    display: inline-block;
    font-size: 0.65rem;
    transition: transform 0.2s ease;
  }

  .tag-toggle.open .arrow { transform: rotate(90deg); }

  .tag-row {
    display: none;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: 0.5rem;
    padding: 0.6rem 0;
  }

  .tag-row.open { display: flex; }

  .tag-chip {
    font-family: var(--font-serif);
    font-size: 0.78rem;
    padding: 0.22rem 0.65rem;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    border-radius: 2px;
    cursor: pointer;
    transition: all var(--transition);
    letter-spacing: 0.02em;
  }

  .tag-chip:hover { border-color: var(--accent); color: var(--accent); }

  .tag-chip.active {
    background: var(--tag-active);
    color: var(--tag-active-text);
    border-color: var(--tag-active);
  }

  /* ===== REFERENCE LIST ===== */
  .ref-list { list-style: none; }

  .ref-item {
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--border-light);
    animation: fadeIn 0.25s ease;
  }

  .ref-item:last-child { border-bottom: none; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .ref-head {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
  }

  .ref-number {
    font-size: 0.72rem;
    color: var(--text-muted);
    font-family: var(--font-mono);
    flex-shrink: 0;
    white-space: nowrap;
  }

  .ref-title {
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text);
    flex: 1;
    min-width: 0;
  }

  .ref-detail {
    display: flex;
    align-items: baseline;
    gap: 0.4rem;
    flex-wrap: wrap;
    margin-top: 0.15rem;
    padding-left: 2.8rem;
  }

  .ref-authors {
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  .ref-authors a, .ref-authors .author-filter-link {
    color: var(--text-muted);
    text-decoration: none;
    border-bottom: 1px dotted var(--border);
    transition: all var(--transition);
  }

  .ref-authors a:hover, .ref-authors .author-filter-link:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .ref-dot {
    color: var(--border);
    font-size: 0.7rem;
  }

  .ref-meta {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-style: italic;
  }

  .ref-links {
    display: inline-flex;
    gap: 0.55rem;
    flex-wrap: wrap;
    align-items: baseline;
  }

  .ref-links a {
    font-size: 0.78rem;
    color: var(--accent);
    text-decoration: none;
    transition: color var(--transition);
  }

  .ref-links a:hover {
    color: var(--accent-hover);
    text-decoration: underline;
  }

  .ref-type {
    font-size: 0.78rem;
    cursor: default;
  }

  /* ===== AUTHOR LIST ===== */
  .author-list { list-style: none; }

  .author-item {
    display: flex;
    align-items: baseline;
    gap: 0.4rem;
    flex-wrap: wrap;
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--border-light);
  }

  .author-item:last-child { border-bottom: none; }

  .author-name {
    font-size: 0.95rem;
    font-weight: 600;
  }

  .author-name a {
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px dotted var(--border);
    transition: all var(--transition);
  }

  .author-name a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .author-affiliation {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-style: italic;
  }

  .author-pub-count {
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .author-dot {
    color: var(--border);
    font-size: 0.7rem;
  }

  .author-show-refs {
    font-family: var(--font-serif);
    font-size: 0.78rem;
    color: var(--accent);
    cursor: pointer;
    border: none;
    background: none;
    padding: 0;
    text-decoration: none;
    border-bottom: 1px dotted var(--accent);
    transition: all var(--transition);
  }

  .author-show-refs:hover {
    color: var(--accent-hover);
    border-bottom-style: solid;
  }

  /* ===== SECTION VIEW TOGGLE ===== */
  .view-section { display: none; }
  .view-section.active { display: block; }

  /* ===== ACTIVE FILTER BANNER ===== */
  .active-filter-banner {
    display: none;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1.2rem;
    padding: 0.6rem 1rem;
    background: var(--bg-alt);
    border: 1px solid var(--accent);
    border-radius: 3px;
    font-size: 0.88rem;
    color: var(--text);
  }

  .active-filter-banner.visible { display: flex; }

  .active-filter-banner .filter-label {
    font-variant: small-caps;
    color: var(--text-muted);
    font-size: 0.8rem;
    letter-spacing: 0.04em;
  }

  .active-filter-banner .filter-value {
    font-weight: 600;
    color: var(--accent);
  }

  .active-filter-banner .clear-filter {
    margin-left: auto;
    font-family: var(--font-serif);
    font-size: 0.8rem;
    padding: 0.2rem 0.55rem;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    border-radius: 2px;
    cursor: pointer;
    transition: all var(--transition);
  }

  .active-filter-banner .clear-filter:hover {
    background: var(--accent);
    color: var(--tag-active-text);
    border-color: var(--accent);
  }

  /* ===== EMPTY STATE ===== */
  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-muted);
    font-style: italic;
  }

  /* ===== FOOTER ===== */
  .site-footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1.5px solid var(--border);
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.7;
  }

  .site-footer a {
    color: var(--accent);
    text-decoration: none;
  }

  /* ===== STATISTICS VIEW ===== */
  .stats-summary {
    margin-bottom: 2rem;
    font-size: 0.9rem;
    line-height: 2;
  }

  .stats-total {
    font-size: 0.95rem;
    margin-bottom: 0.5rem;
    color: var(--text);
  }

  .stats-total strong { font-weight: 600; }

  .stats-type-line {
    color: var(--text-muted);
  }

  .stats-type-line .stats-emoji { margin-right: 0.15rem; }
  .stats-type-line .stats-count { font-weight: 600; color: var(--text); }

  .stats-chart-title {
    font-size: 0.92rem;
    font-variant: small-caps;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    margin-bottom: 0.8rem;
  }

  .stats-chart {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 220px;
    padding-bottom: 2.8rem;
    position: relative;
    border-bottom: 1px solid var(--border);
  }

  .stats-bar-group {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    height: 100%;
    justify-content: flex-end;
  }

  .stats-bar-stack {
    width: 100%;
    max-width: 32px;
    display: flex;
    flex-direction: column-reverse;
  }

  .stats-bar-segment {
    width: 100%;
    min-height: 0;
    transition: opacity 0.2s;
  }

  .stats-bar-segment:first-child {
    border-radius: 0 0 2px 2px;
  }

  .stats-bar-segment:last-child {
    border-radius: 2px 2px 0 0;
  }

  .stats-bar-group:hover .stats-bar-segment { opacity: 0.8; }

  .stats-bar-total {
    font-size: 0.65rem;
    color: var(--text-muted);
    margin-bottom: 2px;
    text-align: center;
  }

  .stats-bar-year {
    position: absolute;
    bottom: -2.4rem;
    font-size: 0.62rem;
    color: var(--text-muted);
    transform: rotate(-45deg);
    transform-origin: top left;
    white-space: nowrap;
  }

  .stats-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 0.8rem;
    margin-top: 2.2rem;
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .stats-legend-item {
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .stats-legend-swatch {
    width: 12px;
    height: 12px;
    border-radius: 2px;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 600px) {
    html { font-size: 15.5px; }
    .page-wrapper { padding: 2rem 1rem 3rem; }
    .site-header h1 { font-size: 1.65rem; }
    .nav-tab { padding: 0.6rem 1rem; font-size: 0.9rem; }
    .filter-bar { flex-direction: column; align-items: stretch; }
    .filter-sep { display: none; }
    .result-count { margin-left: 0; margin-top: 0.3rem; }
    .author-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="page-wrapper">

  <!-- LANGUAGE TOGGLE -->
  <div class="lang-toggle">
    <button class="lang-btn active" data-lang="en" title="English">🇬🇧</button>
    <button class="lang-btn" data-lang="ja" title="日本語">🇯🇵</button>
  </div>

  <!-- HEADER -->
  <header class="site-header">
    <p class="subtitle" data-i18n="header_subtitle">References for</p>
    <h1 data-i18n="header_title">Multiple Eisenstein Series</h1>
  </header>

  <!-- NAVIGATION -->
  <nav class="nav-tabs">
    <button class="nav-tab active" data-view="references" data-i18n="nav_references">References</button>
    <button class="nav-tab" data-view="authors" data-i18n="nav_authors">Mathematicians</button>
    <button class="nav-tab" data-view="stats" data-i18n="nav_stats">Statistics</button>
  </nav>

  <!-- ==================== REFERENCES VIEW ==================== -->
  <section id="view-references" class="view-section active">

    <!-- Author filter banner -->
    <div class="active-filter-banner" id="author-filter-banner">
      <span class="filter-label" data-i18n="filter_by_author">Filtering by author:</span>
      <span class="filter-value" id="author-filter-name"></span>
      <button class="clear-filter" id="clear-author-filter" data-i18n="clear">Clear</button>
    </div>

    <!-- Search bar -->
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search titles, authors, journals..." data-i18n-placeholder="search_placeholder">
    </div>

    <!-- Filter bar -->
    <div class="filter-bar">
      <label data-i18n="label_type">Type:</label>
      <select id="filter-type">
        <option value="all" data-i18n="all_types">All types</option>
      </select>
      <div class="filter-sep"></div>
      <label>🌍</label>
      <select id="filter-lang">
        <option value="all" data-i18n="all_languages">All languages</option>
      </select>
      <div class="filter-sep"></div>
      <label data-i18n="label_sort">Sort:</label>
      <button class="sort-btn active" id="sort-year-desc" data-i18n="newest_first">Newest first</button>
      <button class="sort-btn" id="sort-year-asc" data-i18n="oldest_first">Oldest first</button>
      <span class="result-count" id="result-count"></span>
    </div>

    <!-- Tag chips (collapsible) -->
    <div class="tag-section">
      <button class="tag-toggle" id="tag-toggle">
        <span class="arrow">&#9654;</span> <span data-i18n="filter_by_topic">Filter by topic</span>
      </button>
      <div class="tag-row" id="tag-row"></div>
    </div>

    <!-- Reference list -->
    <ol class="ref-list" id="ref-list"></ol>
    <div class="empty-state" id="empty-state" style="display:none;" data-i18n="no_results">No references match the current filters.</div>

  </section>

  <!-- ==================== AUTHORS VIEW ==================== -->
  <section id="view-authors" class="view-section">
    <ul class="author-list" id="author-list"></ul>
  </section>

  <!-- ==================== STATISTICS VIEW ==================== -->
  <section id="view-stats" class="view-section">
    <div id="stats-summary" class="stats-summary"></div>
    <div class="stats-chart-title" data-i18n="chart_title">References by year</div>
    <div id="stats-chart" class="stats-chart"></div>
    <div id="stats-legend" class="stats-legend"></div>
  </section>

  <!-- FOOTER -->
  <footer class="site-footer">
    <p><span data-i18n="created_by">Created by:</span> <a href="https://www.henrikbachmann.com/">Henrik Bachmann</a></p>
    <p><span data-i18n="last_updated">Last updated:</span> March 2026</p>
  </footer>

</div>

<!-- ==================== INLINE DATABASE ==================== -->

      chart_title: '年別文献数',
      total_entries: '総文献数',
      total_authors: '研究者数',
    }
  };

  // Type names in Japanese
  const TYPE_NAME = {
    en: { paper: 'paper', preprint: 'preprint', book: 'book', thesis: 'thesis', notes: 'notes', slides: 'slides', 'lecture notes': 'lecture notes', blog: 'blog post', video: 'video', poster: 'poster' },
    ja: { paper: '論文', preprint: 'プレプリント', book: '書籍', thesis: '学位論文', notes: 'ノート', slides: 'スライド', 'lecture notes': '講義ノート', blog: 'ブログ記事', video: '動画', poster: 'ポスター' }
  };

  let currentLang = 'en';

  function t(key) {
    return (I18N[currentLang] && I18N[currentLang][key]) || I18N.en[key] || key;
  }

  function typeName(type) {
    return (TYPE_NAME[currentLang] && TYPE_NAME[currentLang][type]) || type;
  }

  function applyI18n() {
    $$('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if (I18N[currentLang] && I18N[currentLang][key]) {
        el.textContent = I18N[currentLang][key];
      }
    });
    $$('[data-i18n-placeholder]').forEach(el => {
      const key = el.dataset.i18nPlaceholder;
      if (I18N[currentLang] && I18N[currentLang][key]) {
        el.placeholder = I18N[currentLang][key];
      }
    });
  }

  // Language toggle
  $$('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLang = btn.dataset.lang;
      $$('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.documentElement.lang = currentLang === 'ja' ? 'ja' : 'en';
      applyI18n();
      populateDropdowns();
      renderReferences();
      renderAuthors();
      renderStats();
    });
  });

  // Language → flag emoji mapping
  const LANG_FLAGS = {
    'English': '\u{1F1EC}\u{1F1E7}',
    'German': '\u{1F1E9}\u{1F1EA}',
    'Japanese': '\u{1F1EF}\u{1F1F5}'
  };

  // Type → emoji mapping
  const TYPE_EMOJI = {
    'paper': '\u{1F4C4}',
    'book': '\u{1F4D6}',
    'preprint': '\u{1F4DD}',
    'notes': '\u{1F5D2}\uFE0F',
    'slides': '\u{1F4CA}',
    'lecture notes': '\u{1F4DA}',
    'thesis': '\u{1F393}',
    'blog': '\u{1F310}',
    'video': '\u{1F3AC}',
    'poster': '\u{1F4CC}'
  };

  function langWithFlag(lang) {
    const flag = LANG_FLAGS[lang] || '';
    return flag ? `${flag} ${lang}` : lang;
  }

  // --- State ---
  let sortDesc = true;
  let activeAuthorFilter = null; // author id or null

  // --- Author HTML for reference list (clickable to filter) ---
  function getAuthorName(a) {
    return (currentLang === 'ja' && a.name_ja) ? a.name_ja : a.name;
  }

  function getAuthorAffiliation(a) {
    return (currentLang === 'ja' && a.affiliation_ja) ? a.affiliation_ja : a.affiliation;
  }

  function getAuthorHTML(id) {
    const a = authorMap.get(id);
    if (!a) return id;
    const displayName = getAuthorName(a);
    return `<a class="author-filter-link" data-author-id="${a.id}" href="javascript:void(0)">${displayName}</a>`;
  }

  // --- Gather unique values ---
  const allTypes = [...new Set(REFERENCES.map(r => r.type))].sort();
  const allLangs = [...new Set(REFERENCES.map(r => r.language))].sort();
  const allTags  = [...new Set(REFERENCES.flatMap(r => r.tags))].sort();

  // --- Populate dropdowns (called on init and language switch) ---
  const typeSelect = $('#filter-type');
  const langSelect = $('#filter-lang');

  function populateDropdowns() {
    // Preserve current selections
    const curType = typeSelect.value;
    const curLang = langSelect.value;

    // Clear and repopulate type dropdown
    typeSelect.innerHTML = '';
    const oAll = document.createElement('option');
    oAll.value = 'all'; oAll.textContent = t('all_types');
    typeSelect.appendChild(oAll);
    allTypes.forEach(tp => {
      const o = document.createElement('option');
      const emoji = TYPE_EMOJI[tp] || '';
      o.value = tp; o.textContent = `${emoji} ${typeName(tp)}`;
      typeSelect.appendChild(o);
    });
    typeSelect.value = curType;

    // Clear and repopulate language dropdown
    langSelect.innerHTML = '';
    const oAllL = document.createElement('option');
    oAllL.value = 'all'; oAllL.textContent = t('all_languages');
    langSelect.appendChild(oAllL);
    allLangs.forEach(l => {
      const o = document.createElement('option');
      o.value = l; o.textContent = langWithFlag(l);
      langSelect.appendChild(o);
    });
    langSelect.value = curLang;
  }

  populateDropdowns();

  // --- Populate tag chips ---
  const tagRow = $('#tag-row');
  allTags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tag-chip';
    btn.dataset.tag = tag;
    btn.textContent = tag;
    btn.addEventListener('click', () => {
      btn.classList.toggle('active');
      renderReferences();
    });
    tagRow.appendChild(btn);
  });

  // --- Tag section toggle ---
  const tagToggle = $('#tag-toggle');
  tagToggle.addEventListener('click', () => {
    tagToggle.classList.toggle('open');
    tagRow.classList.toggle('open');
    const hasActive = tagRow.querySelector('.tag-chip.active');
    const label = hasActive && !tagToggle.classList.contains('open') ? t('filter_by_topic_active') : t('filter_by_topic');
    tagToggle.innerHTML = `<span class="arrow">&#9654;</span> ${label}`;
  });

  // --- Sorting ---
  $('#sort-year-desc').addEventListener('click', () => {
    sortDesc = true;
    $('#sort-year-desc').classList.add('active');
    $('#sort-year-asc').classList.remove('active');
    renderReferences();
  });
  $('#sort-year-asc').addEventListener('click', () => {
    sortDesc = false;
    $('#sort-year-asc').classList.add('active');
    $('#sort-year-desc').classList.remove('active');
    renderReferences();
  });

  typeSelect.addEventListener('change', renderReferences);
  langSelect.addEventListener('change', renderReferences);

  // --- Search ---
  const searchInput = $('#search-input');
  searchInput.addEventListener('input', renderReferences);

  // --- Author filter functions ---
  function setAuthorFilter(authorId) {
    activeAuthorFilter = authorId;
    const a = authorMap.get(authorId);
    const banner = $('#author-filter-banner');
    $('#author-filter-name').textContent = a ? getAuthorName(a) : authorId;
    banner.classList.add('visible');

    // Switch to references view
    $$('.nav-tab').forEach(t => t.classList.remove('active'));
    $$('.nav-tab')[0].classList.add('active');
    $$('.view-section').forEach(v => v.classList.remove('active'));
    $('#view-references').classList.add('active');

    renderReferences();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function clearAuthorFilter() {
    activeAuthorFilter = null;
    $('#author-filter-banner').classList.remove('visible');
    renderReferences();
  }

  $('#clear-author-filter').addEventListener('click', clearAuthorFilter);

  // --- Search highlight helper ---
  function highlightText(text, query) {
    if (!query) return text;
    // Escape regex special chars in query
    const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(`(${escaped})`, 'gi');
    return text.replace(re, '<mark class="search-hl">$1</mark>');
  }

  // --- Render references ---
  function renderReferences() {
    const typeFilter = typeSelect.value;
    const langFilter = langSelect.value;
    const activeTags = [...$$('.tag-chip.active')].map(b => b.dataset.tag);
    const searchQuery = (searchInput.value || '').trim().toLowerCase();

    let refs = REFERENCES.filter(r => {
      if (typeFilter !== 'all' && r.type !== typeFilter) return false;
      if (langFilter !== 'all' && r.language !== langFilter) return false;
      if (activeTags.length > 0 && !activeTags.some(t => r.tags.includes(t))) return false;
      if (activeAuthorFilter) {
        const allAuthors = [...r.authors, ...(r.appendix || [])];
        if (!allAuthors.includes(activeAuthorFilter)) return false;
      }
      if (searchQuery) {
        const authorNames = [...r.authors, ...(r.appendix || [])]
          .map(id => { const a = authorMap.get(id); return a ? (a.name + ' ' + (a.name_ja || '')) : ''; })
          .join(' ').toLowerCase();
        const haystack = [
          r.title, r.journal, r.type, r.language,
          authorNames, r.year.toString(),
          ...r.tags
        ].join(' ').toLowerCase();
        if (!haystack.includes(searchQuery)) return false;
      }
      return true;
    });

    refs.sort((a, b) => {
      const diff = sortDesc ? b.year - a.year : a.year - b.year;
      if (diff !== 0) return diff;
      const ma = a.month || 0, mb = b.month || 0;
      return sortDesc ? mb - ma : ma - mb;
    });

    const list = $('#ref-list');
    const empty = $('#empty-state');
    list.innerHTML = '';

    if (refs.length === 0) {
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      refs.forEach((r, i) => {
        const li = document.createElement('li');
        li.className = 'ref-item';

        const hl = (text) => highlightText(text, searchQuery);

        const authorsHTML = r.authors.map(id => {
          const a = authorMap.get(id);
          if (!a) return id;
          const displayName = getAuthorName(a);
          const hlName = hl(displayName);
          return `<a class="author-filter-link" data-author-id="${a.id}" href="javascript:void(0)">${hlName}</a>`;
        }).join(', ');
        const appendixHTML = r.appendix
          ? `, ${t('appendix_by')} ${r.appendix.map(id => {
              const a = authorMap.get(id);
              if (!a) return id;
              const displayName = getAuthorName(a);
              const hlName = hl(displayName);
              return `<a class="author-filter-link" data-author-id="${a.id}" href="javascript:void(0)">${hlName}</a>`;
            }).join(', ')}`
          : '';

        const linksHTML = r.links.map(l =>
          `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`
        ).join('');

        const flag = LANG_FLAGS[r.language] || '';

        const typeEmoji = TYPE_EMOJI[r.type] || '';

        li.innerHTML = `
          <div class="ref-head">
            <span class="ref-number">[${i + 1}]</span>
            <span class="ref-title">${hl(r.title)}</span>
          </div>
          <div class="ref-detail">
            <span class="ref-authors">${authorsHTML}${appendixHTML}</span>
            <span class="ref-dot">·</span>
            <span class="ref-meta">${hl(r.journal)}, ${r.year}</span>
            <span class="ref-dot">·</span>
            <span class="ref-type" title="${r.type}">${flag} ${typeEmoji} ${typeName(r.type)}</span>
            ${linksHTML ? '<span class="ref-dot">·</span>' : ''}
            <span class="ref-links">${linksHTML}</span>
          </div>
        `;
        list.appendChild(li);
      });
    }

    $('#result-count').textContent = `${refs.length} ${t('of')} ${REFERENCES.length} ${t('entries')}`;

    // Attach author click handlers
    list.querySelectorAll('.author-filter-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        setAuthorFilter(link.dataset.authorId);
      });
    });

    // Re-render KaTeX
    if (window.renderMathInElement) {
      renderMathInElement(list, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false },
          { left: '\\[', right: '\\]', display: true }
        ],
        throwOnError: false
      });
    }
  }

  // --- Render authors ---
  // Type display order: paper first, then the rest
  const TYPE_ORDER = ['paper', 'preprint', 'book', 'thesis', 'notes', 'slides', 'lecture notes', 'blog', 'video', 'poster'];

  function renderAuthors() {
    const list = $('#author-list');
    list.innerHTML = '';

    // Count publications per author, broken down by type
    const pubByType = new Map();
    const pubCount = new Map();
    REFERENCES.forEach(r => {
      const allIds = [...r.authors, ...(r.appendix || [])];
      allIds.forEach(id => {
        pubCount.set(id, (pubCount.get(id) || 0) + 1);
        if (!pubByType.has(id)) pubByType.set(id, new Map());
        const m = pubByType.get(id);
        m.set(r.type, (m.get(r.type) || 0) + 1);
      });
    });

    // Sort alphabetically by family name (last word of name)
    const sorted = [...AUTHORS]
      .filter(a => (pubCount.get(a.id) || 0) > 0)
      .sort((a, b) => {
        const famA = a.name.split(' ').pop().toLowerCase();
        const famB = b.name.split(' ').pop().toLowerCase();
        return famA.localeCompare(famB);
      });

    sorted.forEach(a => {
      const count = pubCount.get(a.id) || 0;
      const types = pubByType.get(a.id) || new Map();

      // Build type breakdown string, papers first
      const breakdown = TYPE_ORDER
        .filter(t => types.has(t))
        .map(t => `${TYPE_EMOJI[t] || ''}\u00A0${types.get(t)}`)
        .join('  ');

      const li = document.createElement('li');
      li.className = 'author-item';

      const displayName = getAuthorName(a);
      const displayAff = getAuthorAffiliation(a);
      const nameHTML = a.url
        ? `<a href="${a.url}" target="_blank" rel="noopener">${displayName}</a>`
        : displayName;

      li.innerHTML = `
        <span class="author-name">${nameHTML}</span>
        ${displayAff ? `<span class="author-dot">·</span><span class="author-affiliation">${displayAff}</span>` : ''}
        <span class="author-dot">·</span>
        <button class="author-show-refs" data-author-id="${a.id}">${count} ${t('references')} (${breakdown})</button>
      `;
      list.appendChild(li);
    });

    // Attach click handlers
    list.querySelectorAll('.author-show-refs').forEach(btn => {
      btn.addEventListener('click', () => {
        setAuthorFilter(btn.dataset.authorId);
      });
    });
  }

  // --- Navigation ---
  $$('.nav-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      $$('.nav-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      $$('.view-section').forEach(v => v.classList.remove('active'));
      $(`#view-${tab.dataset.view}`).classList.add('active');
      updateURL();
    });
  });

  // --- Render statistics ---
  const TYPE_COLORS = {
    'paper': '#2b7a5f',
    'preprint': '#5cad8a',
    'book': '#d4813a',
    'thesis': '#8e6bbf',
    'notes': '#c4a84d',
    'slides': '#4a9ec2',
    'lecture notes': '#3ab88a',
    'blog': '#d46a8a',
    'video': '#6a8ad4',
    'poster': '#d4a24a'
  };

  function renderStats() {
    const summary = $('#stats-summary');
    const chart = $('#stats-chart');
    const legend = $('#stats-legend');

    // --- Summary list ---
    const typeCounts = new Map();
    REFERENCES.forEach(r => typeCounts.set(r.type, (typeCounts.get(r.type) || 0) + 1));

    const authorCount = AUTHORS.filter(a => {
      return REFERENCES.some(r => r.authors.includes(a.id) || (r.appendix || []).includes(a.id));
    }).length;

    // English plural helper
    function plural(count, singular) {
      if (currentLang === 'ja') return singular; // Japanese doesn't pluralize
      // types that don't change in plural
      const unchanged = ['notes', 'slides', 'lecture notes'];
      if (unchanged.includes(singular)) return singular;
      if (count === 1) return singular;
      if (singular === 'thesis') return 'theses';
      return singular + 's';
    }

    let summaryHTML = `<div class="stats-total"><strong>${REFERENCES.length}</strong> ${t('total_entries')} · <strong>${authorCount}</strong> ${t('total_authors')}</div>`;

    TYPE_ORDER.filter(tp => typeCounts.has(tp)).forEach(tp => {
      const c = typeCounts.get(tp);
      summaryHTML += `<div class="stats-type-line"><span class="stats-emoji">${TYPE_EMOJI[tp] || ''}</span> <span class="stats-count">${c}</span> ${plural(c, typeName(tp))}</div>`;
    });
    summary.innerHTML = summaryHTML;

    // --- Bar chart by year ---
    const startYear = 2004;
    const endYear = new Date().getFullYear();
    const years = [];
    for (let y = startYear; y <= endYear; y++) years.push(y);

    // Count per year per type
    const yearData = new Map();
    years.forEach(y => yearData.set(y, new Map()));
    REFERENCES.forEach(r => {
      if (r.year >= startYear && r.year <= endYear) {
        const ym = yearData.get(r.year);
        ym.set(r.type, (ym.get(r.type) || 0) + 1);
      }
    });

    const maxTotal = Math.max(...years.map(y => {
      let sum = 0;
      yearData.get(y).forEach(v => sum += v);
      return sum;
    }), 1);

    const activeTypes = TYPE_ORDER.filter(tp => typeCounts.has(tp));

    let chartHTML = '';
    years.forEach(y => {
      const ym = yearData.get(y);
      let total = 0;
      ym.forEach(v => total += v);
      const heightPct = (total / maxTotal) * 100;

      let stackHTML = '';
      activeTypes.forEach(tp => {
        const count = ym.get(tp) || 0;
        if (count > 0) {
          const segPct = (count / total) * heightPct;
          stackHTML += `<div class="stats-bar-segment" style="height:${segPct}%;background:${TYPE_COLORS[tp] || '#999'}" title="${typeName(tp)}: ${count}"></div>`;
        }
      });

      chartHTML += `<div class="stats-bar-group">
        ${total > 0 ? `<div class="stats-bar-total">${total}</div>` : ''}
        <div class="stats-bar-stack" style="height:${heightPct}%">${stackHTML}</div>
        <span class="stats-bar-year">${y}</span>
      </div>`;
    });
    chart.innerHTML = chartHTML;

    // --- Legend ---
    let legendHTML = '';
    activeTypes.forEach(tp => {
      legendHTML += `<div class="stats-legend-item"><div class="stats-legend-swatch" style="background:${TYPE_COLORS[tp] || '#999'}"></div>${TYPE_EMOJI[tp] || ''} ${typeName(tp)}</div>`;
    });
    legend.innerHTML = legendHTML;
  }

  // --- URL state system ---
  function updateURL() {
    try {
      const params = new URLSearchParams();
      if (typeSelect.value !== 'all') params.set('type', typeSelect.value);
      if (langSelect.value !== 'all') params.set('lang', langSelect.value);
      if (activeAuthorFilter) params.set('author', activeAuthorFilter);
      if (searchInput.value.trim()) params.set('q', searchInput.value.trim());
      if (!sortDesc) params.set('sort', 'asc');
      const activeTab = document.querySelector('.nav-tab.active');
      if (activeTab && activeTab.dataset.view !== 'references') params.set('view', activeTab.dataset.view);
      const qs = params.toString();
      const url = qs ? `${window.location.pathname}?${qs}` : window.location.pathname;
      history.replaceState(null, '', url);
    } catch(e) { /* sandboxed environment */ }
  }

  function loadFromURL() {
    try {
      const params = new URLSearchParams(window.location.search);
      if (params.has('type')) typeSelect.value = params.get('type');
      if (params.has('lang')) langSelect.value = params.get('lang');
      if (params.has('q')) searchInput.value = params.get('q');
      if (params.has('sort') && params.get('sort') === 'asc') {
        sortDesc = false;
        $('#sort-year-desc').classList.remove('active');
        $('#sort-year-asc').classList.add('active');
      }
      if (params.has('author')) {
        setAuthorFilter(params.get('author'));
      }
      if (params.has('view')) {
        const viewName = params.get('view');
        $$('.nav-tab').forEach(tab => {
          tab.classList.toggle('active', tab.dataset.view === viewName);
        });
        $$('.view-section').forEach(v => {
          v.classList.toggle('active', v.id === `view-${viewName}`);
        });
      }
    } catch(e) { /* sandboxed environment */ }
  }

  // Hook URL updates into all filter changes
  const _origRender = renderReferences;
  renderReferences = function() { _origRender(); updateURL(); };

  // --- Init ---
  loadFromURL();
  renderReferences();
  renderAuthors();
  renderStats();

  // KaTeX auto-render on load
  document.addEventListener('DOMContentLoaded', () => {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false },
          { left: '\\[', right: '\\]', display: true }
        ],
        throwOnError: false
      });
    }
  });

  // Fallback for deferred KaTeX
  window.addEventListener('load', () => {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false },
          { left: '\\[', right: '\\]', display: true }
        ],
        throwOnError: false
      });
    }
  });

})();
</script>

</body>
</html>
